
services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: mahiks-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-mahiks_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mahiks_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mahiks-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.13
    container_name: mahiks-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-mahiks_neo4j_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - mahiks-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-mahiks_neo4j_password}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama Local LLM - COMMENTED OUT (Using host Ollama instead)
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: mahiks-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - mahiks-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "ollama list || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 60s

  # Qdrant Vector Database (hybrid dense + BM25 sparse)
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: mahiks-qdrant
    ports:
      - "6333:6333"  # REST
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - mahiks-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # query level cache with Redis
  redis:
    image: redis:7-alpine
    container_name: mahiks-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mahiks-network
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mahiks-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - mahiks-network
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mahiks-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - mahiks-network
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  mysql_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  qdrant_data:
    driver: local
  redis_data:
    driver: local
  hf_cache:
    driver: local

networks:
  mahiks-network:
    driver: bridge
