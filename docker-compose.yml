version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: mahiks-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-mahiks_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mahiks_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mahiks-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.13
    container_name: mahiks-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-mahiks_neo4j_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - mahiks-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-mahiks_neo4j_password}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama Local LLM - COMMENTED OUT (Using host Ollama instead)
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: mahiks-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - mahiks-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "ollama list || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 60s

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mahiks-backend
    ports:
      - "8000:8000"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-mahiks_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-mahiks_db}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-mahiks_neo4j_password}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:1b}
      - CHROMA_PERSIST_DIR=/app/chroma_data
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - chroma_data:/app/chroma_data
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - mahiks-network
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

volumes:
  mysql_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  chroma_data:
    driver: local
  ollama_data:
    driver: local

networks:
  mahiks-network:
    driver: bridge
